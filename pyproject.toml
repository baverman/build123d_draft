[tool.poetry]
name = "build123d-draft"
version = "0.1.0"
description = "Helpers for build123d"
authors = ["Anton Bobrov"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8"
build123d = "^0.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pillow = "^11.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["build123d_draft", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
markers = [
    "current: mark a current test to execute",
    "views: declare multiple views for part",
]
filterwarnings = [
    "ignore::DeprecationWarning:lib3mf",
    "ignore::_pytest.warning_types.PytestReturnNotNoneWarning",
]
